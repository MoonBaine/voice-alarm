name: voice_alarm
description: Budzik, ktory wylaczysz tylko nagrywajac glosowke (min. 5 s).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  alarm: ^5.15.0
  record: ^7.2.0
  just_audio: ^0.10.6
  file_picker: ^13.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  permission_handler: ^12.0.0
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1
  cross_file: ^0.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
